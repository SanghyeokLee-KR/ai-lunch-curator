<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AI 점심 큐레이터{% endblock %}</title>
  <meta name="description" content="매일 사내 점심 식단을 AI가 분석하고 그려서 보여주는 큐레이터" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="12" cy="12" r="3.1" fill="currentColor" />
        </svg>
        <span class="brand-text">점심 큐레이터</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="navlink {{ 'is-active' if active == 'today' else '' }}">오늘</a>
        <a href="/history" class="navlink {{ 'is-active' if active == 'history' else '' }}">이력</a>
        <a href="/stats" class="navlink {{ 'is-active' if active == 'stats' else '' }}">통계</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="라이트/다크 전환" title="테마 전환">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4" fill="currentColor" />
          <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <line x1="12" y1="2.5" x2="12" y2="5" /><line x1="12" y1="19" x2="12" y2="21.5" />
            <line x1="2.5" y1="12" x2="5" y2="12" /><line x1="19" y1="12" x2="21.5" y2="12" />
            <line x1="5.2" y1="5.2" x2="7" y2="7" /><line x1="17" y1="17" x2="18.8" y2="18.8" />
            <line x1="5.2" y1="18.8" x2="7" y2="17" /><line x1="17" y1="7" x2="18.8" y2="5.2" />
          </g>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M20 14.6A8 8 0 1 1 9.4 4 6.3 6.3 0 0 0 20 14.6z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </header>

  <main class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <div class="container foot-inner">
      <span class="foot-brand">AI 점심 큐레이터</span>
      <span class="foot-meta">식단 수집 · OpenAI 분석/이미지 · Oracle XE · Teams</span>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
