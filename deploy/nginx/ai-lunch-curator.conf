# AI 점심 큐레이터 Nginx 리버스 프록시 (HTTP)
#
# 적용:
#   sudo cp deploy/nginx/ai-lunch-curator.conf /etc/nginx/sites-available/ai-lunch-curator
#   sudo ln -sf /etc/nginx/sites-available/ai-lunch-curator /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 도메인 + HTTPS:
#   server_name 을 도메인으로 바꾼 뒤  sudo certbot --nginx -d <도메인>
#   → certbot 이 443/리다이렉트 블록을 이 파일에 자동으로 추가한다.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # 도메인 생기면 교체 (예: lunch.example.com)

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;

    # 정적 파일(CSS·생성 이미지)은 앱(컨테이너)이 서빙하도록 프록시 + 길게 캐싱.
    # (호스트 디스크 직접 서빙은 /home/ubuntu 권한(0750) 때문에 www-data 가 못 읽음)
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 나머지는 앱(uvicorn)으로 프록시
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # collect-weekly 백그라운드 트리거 여유
    }
}
