name: Daily Teams Notify

# 평일(월~금) 오전 테스트 발송 + 본 발송(09:00 KST).
#   - GitHub Actions cron 은 UTC 기준. KST = UTC+9.
#   - 07:00·07:30·08:00·08:30 KST = 전날 22:00·22:30·23:00·23:30 UTC → UTC 일~목(0-4)
#   - 09:00 KST = 당일 00:00 UTC → UTC 월~금(1-5)
#   - 어느 시각에 돌든 앱이 '오늘'을 KST 로 계산하므로 그날 메뉴가 나간다.
# 주의(GitHub Actions schedule 한계): 수 분~수십 분 지연 가능 · 60일 무활동 시 비활성 · main 브랜치만 동작.
on:
  schedule:
    - cron: "0 22 * * 0-4"   # 07:00 KST
    - cron: "30 22 * * 0-4"  # 07:30 KST
    - cron: "0 23 * * 0-4"   # 08:00 KST
    - cron: "30 23 * * 0-4"  # 08:30 KST
    - cron: "0 0 * * 1-5"    # 09:00 KST (본 발송)
  workflow_dispatch: {} # 수동 실행 → 데모로 Teams 카드 즉시 발송

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 오늘 메뉴 발송 트리거 (send-today)
        run: |
          curl -fsS --max-time 60 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/send-today" \
            -H "Authorization: Bearer ${{ secrets.COLLECT_TOKEN }}"
