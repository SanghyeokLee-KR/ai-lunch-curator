name: CI

# push/PR 마다 테스트. 외부 호출(OpenAI/Teams)은 전부 목킹돼 있어 시크릿이 필요 없다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # deploy 에서 배포 전 게이트로 재사용

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 (실제 외부 호출 0건)
        run: pytest -v
